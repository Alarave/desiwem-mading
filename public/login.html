<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - GUNDAR Mading</title>
  <!-- Typography & Icons -->
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,500&display=swap">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <!-- Floating Pill Header Navigation -->
  <header>
    <div class="nav-container">
      <a href="/" class="logo">GUNDAR <span>Mading</span></a>
      <nav>
        <ul>
          <li><a href="/">Papan Mading</a></li>
          <li><a href="/dashboard-report.html">Statistik</a></li>
          <li><a href="/login.html" class="active btn-login">Login Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Login Area -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Keamanan Admin</h2>
        <p>Silakan masuk untuk mengelola portal mading Sekolah Tinggi GUNDAR.</p>
      </div>

      <div class="alert-message alert-error" id="error-message">
        Username atau password salah!
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Masukkan username admin" required autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom: 2rem;">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Masuk &rarr;</button>
      </form>
    </div>
  </main>

  <!-- Animation & Script Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/motion.js"></script>
</body>
</html>
